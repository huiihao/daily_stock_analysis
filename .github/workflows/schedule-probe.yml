# 临时诊断文件：验证 fork 仓库的定时任务是否已启用
# 每 5 分钟触发一次 —— 如果 15 分钟内出现「schedule」触发的运行记录，说明定时器已修好
# 验证完毕后应删除本文件
name: Schedule Probe 诊断

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 报告触发方式
        run: |
          echo "触发事件: ${{ github.event_name }}"
          echo "时间(UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "✅✅✅ 定时器已启用 —— fork 的 scheduled workflow 可以正常触发"
          else
            echo "ℹ️ 这是手动触发。请等 5 分钟看是否出现 schedule 触发的记录。"
          fi
