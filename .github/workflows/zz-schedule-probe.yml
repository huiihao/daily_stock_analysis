# 临时诊断文件：验证 fork 仓库的定时任务是否真的会触发
# 用途：如果 15 分钟内出现定时触发的运行记录，说明定时器正常工作
# 验证完毕后应删除本文件
name: Schedule Probe

on:
  schedule:
    # 每 5 分钟触发一次（GitHub 最小粒度）
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 报告触发方式
        run: |
          echo "触发事件: ${{ github.event_name }}"
          echo "仓库: ${{ github.repository }}"
          echo "时间(UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "✅ 结论：fork 仓库的定时任务可以正常触发"
          else
            echo "ℹ️ 这是手动触发，无法判断定时器状态"
          fi
